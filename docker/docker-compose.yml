# Docker Compose - Development baseline

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: iaict
      POSTGRES_PASSWORD: iaict_dev
      POSTGRES_DB: iaict_core
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # api sẽ thêm sau khi có NestJS build

volumes:
  pgdata:
