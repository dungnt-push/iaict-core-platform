services:
  - type: web
    name: iaict-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iaict-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    healthCheckPath: /health

  - type: web
    name: iaict-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: iaict-api
          type: web
          property: host
      - key: PORT
        value: 3001

databases:
  - name: iaict-postgres
    plan: free
    databaseName: iaict_core
    user: iaict
